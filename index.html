<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ms_saylan - Sosyal medya profilime hızlıca ulaşın. Instagram bağlantım burada.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://cdn.pixabay.com https://i.imgur.com; style-src 'self' 'unsafe-inline'; font-src https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline'; connect-src 'none'; frame-src 'none';">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="ms_saylan - Sosyal Medya Profili">
  <meta property="og:description" content="ms_saylan'ın Instagram profili.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://cdn.pixabay.com/photo/2021/06/15/12/14/instagram-6338392_1280.png">
  <meta property="og:url" content="https://salyusgt.github.io/">
  <meta name="twitter:card" content="summary_large_image">
  <title>ms_saylan - Sosyal Medya Profili</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      position: relative;
      background: url('https://cdn.pixabay.com/photo/2015/06/19/21/24/avenue-815297_1280.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .leaf-fall-bg {
      pointer-events: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
    }
    .leaf-fall {
      position: absolute;
      width: var(--leaf-size, 44px);
      height: var(--leaf-size, 44px);
      will-change: transform;
      opacity: 0.88;
      animation:
        leaf-fall-move var(--fall-time, 10s) linear infinite,
        leaf-fall-sway var(--sway-time, 4s) ease-in-out infinite alternate,
        leaf-fall-rotate var(--rotate-time, 6s) linear infinite;
    }

    @keyframes leaf-fall-move {
      from { top: -60px; }
      to   { top: 110vh; }
    }
    @keyframes leaf-fall-sway {
      from { transform: translateX(0); }
      to   { transform: translateX(var(--sway, 20px)); }
    }
    @keyframes leaf-fall-rotate {
      from { rotate: 0deg; }
      to   { rotate: var(--rot, 120deg); }
    }

    main.container {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.22);
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      text-align: center;
      width: 100%;
      max-width: 370px;
      padding: 40px 16px;
      margin: 16px;
      outline: none;
      transition: background 0.3s;
    }
    section.profile-block {
      margin-bottom: 36px;
    }
    .profile-pic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #e1306c;
      object-fit: cover;
      margin-bottom: 12px;
      background: #eee;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }
    .platform-label {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 1.13em;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-shadow: 0 2px 6px rgba(255,255,255,0.20);
    }
    .platform-label i {
      font-size: 1.3em;
      vertical-align: middle;
    }
    .view-btn {
      display: inline-block;
      background: linear-gradient(90deg, #f857a6 0%, #ff5858 100%);
      color: #fff;
      padding: 12px 32px;
      border: none;
      border-radius: 12px;
      font-size: 1.07em;
      cursor: pointer;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: .03em;
      box-shadow: 0 4px 16px rgba(232, 48, 108, 0.10), 0 1.5px 4px rgba(0,0,0,0.08);
      margin-top: 8px;
      transition: transform .15s cubic-bezier(.16,1.17,.7,.86), box-shadow .18s, background .20s;
      outline: none;
      border-bottom: 2.5px solid #e1306c44;
    }
    .view-btn:focus, .view-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 28px 0 rgba(88,101,242,0.10),0 2.5px 10px rgba(0,0,0,0.12);
      opacity: 0.93;
      outline: 2px solid #222;
      outline-offset: 2px;
    }
    .username {
      margin-bottom: 6px;
      color: #444;
      font-size: 1em;
      text-shadow: 0 2px 4px rgba(255,255,255,0.14);
    }
    @media (max-width: 500px) {
      main.container {
        padding: 24px 4vw;
        max-width: 99vw;
      }
      .profile-pic {
        width: 70px; height: 70px;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous">
</head>
<body>
  <div class="leaf-fall-bg" aria-hidden="true"></div>
  <main class="container" tabindex="-1">
    <!-- Instagram Profili -->
    <section class="profile-block" aria-labelledby="instagram-label">
      <div class="platform-label" id="instagram-label">
        <i class="fab fa-instagram" aria-hidden="true"></i>
        <span>Instagram</span>
      </div>
      <img 
        class="profile-pic"
        src="https://cdn.pixabay.com/photo/2021/06/15/12/14/instagram-6338392_1280.png"
        alt="ms_saylan Instagram profil fotoğrafı"
        loading="lazy"
        width="100"
        height="100"
      >
      <div class="username">@ms_saylan</div>
      <a 
        href="https://www.instagram.com/ms_saylan" 
        class="view-btn"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram profilini yeni sekmede görüntüle"
        tabindex="0"
      >Görüntüle</a>
    </section>
  </main>
  <script>
    // Farklı gerçek yaprak SVG path'leri (meşe, akçaağaç, çınar vs.)
    const leafSvgs = [
      // Meşe yaprağı - yeşil
      `<svg viewBox="0 0 40 40"><path d="M21 7 Q23 3,27 7 Q30 10,26 13 Q33 14,32 19 Q31 23,25 21 Q28 28,22 26 Q23 34,14 33 Q18 28,12 27 Q13 22,7 22 Q10 18,12 20 Q8 14,14 13 Q12 10,16 9 Q16 4,21 7 Z" fill="#5c842d" stroke="#315017" stroke-width="1.3"/></svg>`,
      // Akçaağaç yaprağı - turuncu
      `<svg viewBox="0 0 40 40"><path d="M20 5 L23 18 L35 11 L25 22 L38 22 L26 25 L32 33 L21 26 L20 39 L19 26 L8 33 L14 25 L2 22 L15 22 L5 11 L17 18 Z" fill="#d68f1e" stroke="#7e5414" stroke-width="1.1"/></svg>`,
      // Çınar yaprağı - sarı
      `<svg viewBox="0 0 40 40"><path d="M20 3 L23 15 L35 8 L25 18 L38 19 L26 21 L34 28 L21 22 L20 38 L19 22 L6 28 L14 21 L2 19 L15 18 L5 8 L17 15 Z" fill="#e8d05a" stroke="#ad990f" stroke-width="1.1"/></svg>`,
      // Kestane yaprağı - kahverengi
      `<svg viewBox="0 0 40 40"><path d="M20 3 Q22 12,31 7 Q29 16,38 14 Q30 20,36 24 Q27 23,33 30 Q24 27,28 37 Q21 32,22 39 Q18 34,12 39 Q15 30,7 33 Q13 25,4 28 Q11 22,2 20 Q8 16,1 14 Q10 13,8 7 Q18 12,20 3 Z" fill="#b46829" stroke="#5e3210" stroke-width="1.2"/></svg>`,
      // Gürgen yaprağı - yeşil-sarı
      `<svg viewBox="0 0 40 40"><ellipse cx="20" cy="20" rx="12" ry="20" fill="#a8c85f" stroke="#768d2c" stroke-width="1.1"/></svg>`
    ];

    const leafBg = document.querySelector('.leaf-fall-bg');
    const leafCount = 13;

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createLeaf() {
      const div = document.createElement('div');
      div.classList.add('leaf-fall');
      div.innerHTML = leafSvgs[Math.floor(Math.random()*leafSvgs.length)];
      div.style.left = randomBetween(2, 98) + 'vw';
      div.style.top = randomBetween(-120, -30) + 'px';
      const size = randomBetween(34, 64);
      div.style.setProperty('--leaf-size', size + 'px');
      // Yumuşak ve daha az mesafeli sallanma, daha yavaş animasyonlar
      div.style.setProperty('--fall-time', randomBetween(9, 15) + 's');
      div.style.setProperty('--sway-time', randomBetween(3.5, 6.5) + 's');
      div.style.setProperty('--rotate-time', randomBetween(6, 13) + 's');
      div.style.setProperty('--sway', (Math.random() > 0.5 ? 1 : -1) * randomBetween(12, 26) + 'px');
      div.style.setProperty('--rot', (Math.random() > 0.5 ? 1 : -1) * randomBetween(60, 120) + 'deg');
      div.addEventListener('animationiteration', function(e){
        if(e.animationName === 'leaf-fall-move') {
          div.style.left = randomBetween(2, 98) + 'vw';
          div.style.top = randomBetween(-120, -30) + 'px';
          div.style.setProperty('--fall-time', randomBetween(9, 15) + 's');
          div.style.setProperty('--sway-time', randomBetween(3.5, 6.5) + 's');
          div.style.setProperty('--rotate-time', randomBetween(6, 13) + 's');
          div.style.setProperty('--sway', (Math.random() > 0.5 ? 1 : -1) * randomBetween(12, 26) + 'px');
          div.style.setProperty('--rot', (Math.random() > 0.5 ? 1 : -1) * randomBetween(60, 120) + 'deg');
        }
      });
      return div;
    }

    for(let i=0; i<leafCount; ++i){
      leafBg.appendChild(createLeaf());
    }
  </script>
</body>
</html>
